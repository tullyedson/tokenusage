[package]
name = "ai-usage-tray"
version = "0.8.0"
description = "Private AI account usage at a glance in the Windows system tray"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ai_usage_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "process", "io-util", "fs", "macros", "rt", "net"] }
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
zeroize = "1.9"
axum = "0.8.9"
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
